<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Intonation | English Pronunciation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&family=Sora:wght@500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7FF;--ink:#241F3D;--muted:#6B6585;--blue:#0284C7;--pink:#DB2777;--purple:#9333EA;--glass:rgba(255,255,255,.68);--line:rgba(147,51,234,.18);--ok:#16A34A;--bad:#DC2626}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Noto Sans","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(620px 420px at 8% 0%,rgba(147,51,234,.18),transparent 70%),
 radial-gradient(620px 440px at 95% 8%,rgba(2,132,199,.15),transparent 70%),
 radial-gradient(760px 520px at 50% 100%,rgba(219,39,119,.13),transparent 70%)}
h1,h2,h3{font-family:Sora,"Noto Sans","Noto Sans Thai",sans-serif;margin:0;line-height:1.25}
.ipa{font-family:"Noto Sans","Doulos SIL","Charis SIL","Segoe UI","Arial Unicode MS",sans-serif;font-weight:500;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);box-shadow:0 8px 28px rgba(80,40,140,.10);border-radius:20px}

header{position:sticky;top:0;z-index:20;padding:10px 18px;background:rgba(250,247,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hrow{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:Sora,"Noto Sans",system-ui,sans-serif;font-weight:800;font-size:1.05rem}
.brand b{background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(147,51,234,.1);color:var(--purple)}
.sp{flex:1}
.prog{flex:1 1 160px;max-width:260px;height:10px;border-radius:99px;background:rgba(147,51,234,.12);overflow:hidden}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));transition:width .5s}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 14px;border-radius:12px;font-weight:600;font-size:.88rem;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(80,40,140,.15)}
.btn.pri{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border:0}
.btn:focus-visible,.mc:focus-visible,.opt:focus-visible,.dots button:focus-visible,nav.chips a:focus-visible,.road button:focus-visible,.sh-x:focus-visible,.spk:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
nav.chips{max-width:1060px;margin:8px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
nav.chips a{white-space:nowrap;font-size:.8rem;font-weight:600;text-decoration:none;color:var(--ink);padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid var(--line);cursor:pointer;transition:all .25s}
nav.chips a:hover{background:#fff;color:var(--purple)}
nav.chips a.active{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border-color:transparent}

main{max-width:1060px;margin:0 auto;padding:0 18px 90px}
.sec-head{margin-bottom:16px}
.sec-head h2{font-size:clamp(1.3rem,3vw,1.8rem)}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:760px}
.sec-head p b{color:var(--ink)}
.hint{display:inline-block;margin:0 0 12px;font-size:.82rem;color:var(--purple);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;align-items:start}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

/* motion cards */
.mc{position:relative;padding:18px 18px 16px;cursor:pointer;overflow:hidden;animation:rise .55s backwards;animation-delay:calc(var(--i,0)*70ms);transition:transform .25s,box-shadow .25s,border-color .25s;outline:none}
.mc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.mc:hover,.mc:focus-visible{transform:translateY(-4px);box-shadow:0 14px 34px rgba(80,40,140,.18)}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.chev{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);color:var(--c);font-size:.95rem}
.mc h3{font-size:1.08rem;margin:6px 0 4px}
.mc p{margin:2px 0 4px;color:var(--ink);font-size:.93rem}
.mc .big{font-family:Sora,sans-serif;font-weight:800;font-size:1.8rem;color:var(--c);margin-top:6px}
.cit{color:var(--muted);font-size:1.1rem;text-align:center}
.tap{font-size:.76rem;color:var(--c);font-weight:600;margin-top:6px}
.mc.seen::after{content:"\2713  opened";position:absolute;right:14px;bottom:12px;font-size:.7rem;font-weight:700;color:var(--ok)}
.mc.seen .tap{padding-right:64px}
svg.contour{width:100%;height:auto;display:block;overflow:visible;margin:6px 0 2px}
.spill{display:inline-block;margin-left:10px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(147,51,234,.1);color:var(--purple);vertical-align:middle}
.spill.full{background:rgba(22,163,74,.14);color:#166534}
.spk{margin-left:auto;border:0;background:var(--c,var(--purple));color:#fff;border-radius:99px;padding:6px 14px;font-weight:600;font-size:.82rem}
.spk:hover{filter:brightness(1.1)}
.mini{border:0;background:var(--c,var(--purple));color:#fff;border-radius:99px;width:30px;height:30px;cursor:pointer;flex:none}

/* quiz */
.qset{padding:20px}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qn{font-size:.75rem;font-weight:700;color:var(--purple)}
.qt{font-size:1.02rem;margin:2px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:1rem;font-weight:600;color:var(--ink);transition:transform .15s,border-color .15s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--purple)}
.opt.wrong{background:#FEE2E2;border-color:var(--bad);color:var(--bad);opacity:.85;animation:shake .3s}
.opt.wrong.old{animation:none}
.opt.right{background:#DCFCE7;border-color:var(--ok);color:#166534}
.opt:disabled{cursor:not-allowed}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:8px;font-size:.88rem;color:#166534;display:none}
.q.done .fb{display:block;animation:rise .4s backwards}
.try{margin-top:8px;font-size:.85rem;color:var(--bad);font-weight:600}
.sent{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;border-radius:14px;background:rgba(255,255,255,.85);border:1px solid var(--line)}
.sent .ipa{color:var(--blue);font-size:1.15rem}
.score{padding:26px;text-align:center;margin-top:16px;animation:rise .5s backwards}
.score .big{font-family:Sora,"Noto Sans",system-ui,sans-serif;font-size:2.6rem;font-weight:800;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.note{font-size:.8rem;color:var(--muted);margin-top:10px}
.prow{display:grid;grid-template-columns:34px 1fr 1.2fr 56px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);font-size:.92rem}
.prow:first-child{border-top:0}
.prow .bar{height:10px;border-radius:99px;background:rgba(147,51,234,.12);overflow:hidden}
.prow .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink))}

/* deck */
.deck-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.dots{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.dots button{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:99px;padding:6px 12px;font:600 .78rem/1 "Noto Sans",system-ui,sans-serif;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:transform .25s,box-shadow .25s,background .3s}
.dots button:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px var(--purple)}
.dots button.on{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border-color:transparent;box-shadow:0 8px 20px -8px var(--purple)}
.dots button.ok::after{content:"\2713";color:var(--ok);font-weight:800}
.dots button.on.ok::after{color:#fff}
.dots .dn{opacity:.7}
#deckCount{font-size:.82rem;color:var(--muted);font-weight:600}
.deck-stage{position:relative;min-height:420px}
.deck-stage section.slide{display:none;margin:0}
.deck-stage section.slide.active{display:block;animation:slideInR .6s cubic-bezier(.2,.8,.2,1)}
.deck-stage section.slide.active.dirL{animation-name:slideInL}
@keyframes slideInR{from{opacity:0;transform:translateX(56px) scale(.98)}}
@keyframes slideInL{from{opacity:0;transform:translateX(-56px) scale(.98)}}
.deck-nav{display:flex;align-items:center;gap:12px;margin-top:18px}
.deck-nav .bar{flex:1;height:6px;border-radius:99px;background:rgba(147,51,234,.12);overflow:hidden}
.deck-nav .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));transition:width .5s}
.deck-nav .btn:disabled{opacity:.4;pointer-events:none}

/* cover */
.cover{padding:30px;position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(147,51,234,.22),transparent 65%);animation:floaty 7s ease-in-out infinite}
@keyframes floaty{50%{transform:translate(-30px,24px)}}
.cover h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05}
.cover h1 span{background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover p.lead{margin:12px 0 0;color:var(--muted);max-width:640px;font-size:1.05rem}
.w{padding:5px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-family:Sora,"Noto Sans",system-ui,sans-serif;font-weight:600;font-size:1.05rem}
.cover-chain{display:flex;align-items:center;flex-wrap:wrap;margin:22px 0 4px;gap:26px;animation:breathe 4.2s ease-in-out infinite}
.cover-chain .w{font-size:clamp(1.1rem,3.4vw,1.7rem)}
@keyframes breathe{0%,100%{gap:26px}50%{gap:6px}}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:18px}
.legend div{padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:.9rem}
.legend .ipa{font-size:1.15rem;color:var(--purple)}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.road button{text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.8);cursor:pointer;font:inherit;color:var(--ink);border-top:4px solid var(--c);animation:rise .6s backwards;animation-delay:calc(var(--i)*80ms);transition:transform .25s,box-shadow .25s}
.road button:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 28px -10px var(--c)}
.road b{display:block;font-family:Sora,"Noto Sans",system-ui,sans-serif;font-size:.95rem}
.road small{color:var(--muted)}

/* focus lab */
.demo{padding:22px}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dtabs button{border:1px solid var(--line);background:rgba(255,255,255,.85);border-radius:99px;padding:6px 14px;font:600 .82rem "Noto Sans",system-ui,sans-serif;color:var(--ink);cursor:pointer;transition:all .25s}
.dtabs button.on{background:var(--pink);color:#fff;border-color:transparent}
.dstage{padding:20px 14px;margin:6px 0;text-align:center;border-radius:18px;background:rgba(255,255,255,.7);border:1px dashed var(--line)}
.dnote{margin:10px 0 0;font-size:.95rem;text-align:center}
.dnote span{display:block;color:var(--muted)}
.dctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}

/* expanded sheet */
body.sheet-open{overflow:hidden}
#sheet{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:14px}
#sheet.show{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(36,31,61,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
#sheet.in .sheet-bg{opacity:1}
.sheet-card{position:relative;width:min(880px,100%);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow-y:auto;overflow-x:hidden;background:rgba(255,255,255,.95);border-radius:26px;border:1px solid #fff;border-top:7px solid var(--c);box-shadow:0 30px 80px -20px rgba(60,20,120,.5),0 0 60px -18px var(--c);padding:20px 24px 22px;transform-origin:top left}
.sheet-card.fly{transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .35s}
.sheet-card>*{opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}
#sheet.in .sheet-card>*{opacity:1;transform:none}
#sheet.in .sheet-card>*:nth-child(1){transition-delay:.18s}
#sheet.in .sheet-card>*:nth-child(2){transition-delay:.26s}
#sheet.in .sheet-card>*:nth-child(3){transition-delay:.34s}
#sheet.in .sheet-card>*:nth-child(4){transition-delay:.42s}
#sheet.in .sheet-card>*:nth-child(5){transition-delay:.5s}
#sheet.in .sheet-card>*:nth-child(6){transition-delay:.58s}
#sheet.in .sheet-card>*:nth-child(7){transition-delay:.66s}
.sheet-card.swap>*{animation:swapIn .45s backwards}
@keyframes swapIn{from{opacity:0;transform:translateX(24px)}}
.sh-head{display:flex;align-items:flex-start;gap:12px}
.sh-head h3{font-size:clamp(1.2rem,3.4vw,1.7rem);margin:2px 0 0}
.sh-pos{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted);padding-top:4px;white-space:nowrap}
.sh-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1rem;color:var(--ink);flex:none;transition:transform .25s}
.sh-x:hover{transform:rotate(90deg)}
.sh-stage{margin:14px 0 6px;padding:18px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.55));border:1px dashed var(--c);text-align:center}
.sh-stage .btn{margin-top:10px;padding:4px 12px;font-size:.78rem}
.sh-stage .w{font-size:clamp(1.2rem,4vw,2.1rem);border-color:var(--c);color:var(--c)}
.sh-ipa{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid var(--line)}
.sh-ipa>div{display:flex;flex-direction:column}
.sh-ipa .ipa{font-size:1.35rem;color:var(--c)}
.sh-ipa .lbl{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.sh-ex h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.sh-ex p{margin:0;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.7);border-left:4px solid var(--c);font-size:1rem}
.sh-ex p[lang=th]{font-size:1.04rem;line-height:1.75}
.sh-foot{display:flex;align-items:center;gap:10px;margin-top:16px}
.sh-foot .sp{flex:1}
.sh-foot .btn:disabled{opacity:.4;pointer-events:none}

/* present mode */
#pbar{display:none}
body.present nav.chips,body.present .deck-top,body.present .deck-nav{display:none}
body.present main{max-width:1180px;font-size:1.08rem}
body.present #pbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;justify-content:center;align-items:center;gap:14px;padding:10px;background:rgba(250,247,255,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
body.present .mc h3{font-size:1.3rem}
@media (max-width:640px){
  .sheet-card{padding:16px 14px 18px;border-radius:20px}
  .dots .dt{display:none}.dots button.on .dt{display:inline}
  .cover{padding:20px}
  .prow{grid-template-columns:28px 1fr 56px}.prow .bar{display:none}
  .grid.wide{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ===== larger type ===== */
html{font-size:112.5%}
.tag,.qn,.tap,.spill,.badge,.hint,.note,#deckCount,.sh-pos,.sh-ex h4,.sh-ipa .lbl,nav.chips a,.btn,.dt,.try,.fb{font-size:max(.88rem,1em)}
.mc p{font-size:1.02rem}.qt{font-size:1.15rem}.opt{font-size:1.08rem}.sh-ex p,.sh-ex p[lang=th]{font-size:1.12rem}
.sent .ipa,.sh-ipa .ipa{font-size:1.4rem}
/* ===== views ===== */
#login,#trackerView{display:none}
body.st-login header,body.st-login main,body.st-login #pbar{display:none}
body.st-login #login{display:grid}
body.st-tracker main,body.st-tracker nav.chips,body.st-tracker .prog,body.st-tracker #fsBtn,body.st-tracker #presentBtn,body.st-tracker #pbar{display:none}
body.st-tracker #trackerView{display:block}
.who{font-weight:700;font-size:.95rem;color:var(--ink);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== login ===== */
#login{min-height:100vh;place-items:center;padding:24px 16px}
.lg-card{width:100%;max-width:600px;background:#fff;border:1px solid rgba(147,51,234,.14);border-radius:28px;padding:34px 34px 30px;box-shadow:0 24px 70px rgba(99,70,200,.16)}
.lg-badge{display:inline-block;font-weight:700;font-size:.9rem;color:#5B4FD6;background:#EEF0FB;border-radius:99px;padding:7px 14px}
.lg-title{margin:14px 0 8px;font-family:Anton,Sora,Impact,sans-serif;font-weight:400;font-size:clamp(2.6rem,9vw,3.9rem);line-height:1.02;letter-spacing:.01em;text-transform:uppercase;color:#1B1838}
.lg-title em{font-style:normal;background:linear-gradient(90deg,#0284C7,#9333EA 55%,#DB2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-sub{margin:0 0 20px;color:var(--muted);font-size:1.02rem}
.lg-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;background:#EEF0FB;border-radius:18px;margin-bottom:20px}
.lg-tabs button{border:0;background:transparent;padding:13px 8px;border-radius:13px;font-weight:700;font-size:1.05rem;color:#3D3A5C}
.lg-tabs button.on{background:#fff;color:#5B4FD6;box-shadow:0 4px 14px rgba(99,70,200,.18)}
.lg-card label{display:block;font-weight:700;font-size:1rem;margin:0 0 8px}
.lg-card select,.lg-card input{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:16px;border:1.5px solid #DAD9F0;background:#fff;color:var(--ink);margin-bottom:14px}
.lg-card select:focus,.lg-card input:focus,.lg-tabs button:focus-visible,.lg-go:focus-visible{outline:3px solid rgba(147,51,234,.45);outline-offset:2px}
.lg-go{width:100%;border:0;border-radius:16px;padding:16px;font-weight:800;font-size:1.15rem;color:#fff;background:linear-gradient(90deg,#0284C7,#9333EA 55%,#DB2777);box-shadow:0 10px 26px rgba(147,51,234,.28)}
.lg-go:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.lg-err{min-height:1.4em;margin:10px 0 0;color:var(--bad);font-weight:700;font-size:.98rem}
.lg-note{margin:12px 0 0;color:var(--muted);font-size:.92rem;line-height:1.65}
.lg-warn{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:#FFF7E6;border:1px solid #F5D9A0;color:#7A5200;font-size:.9rem}
/* ===== tracker ===== */
.tv{max-width:1240px;margin:0 auto;padding:26px 18px 70px}
.tv h2{font-size:clamp(1.7rem,4vw,2.3rem)}
.tv .sub{color:var(--muted);margin:6px 0 20px;font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.stat{padding:16px 20px}.stat b{display:block;font-family:Sora,sans-serif;font-size:2.4rem;line-height:1.1;background:linear-gradient(90deg,var(--blue),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-weight:600;color:var(--muted);font-size:1rem}
.tbl{overflow:auto;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 28px rgba(80,40,140,.10)}
.tbl table{border-collapse:collapse;width:100%;font-size:1.05rem;min-width:940px}
.tbl th,.tbl td{padding:12px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{background:#F4EEFF;font-weight:800;position:sticky;top:0}
.tbl td:nth-child(2),.tbl th:nth-child(2){text-align:left}
.tbl tfoot th{background:#F4EEFF;border-bottom:0}
.cell{font-weight:700}
.cell.full{background:#DCFCE7;color:#166534}.cell.part{background:#DBEAFE;color:#1E40AF}.cell.none{color:#6B6585;font-weight:500}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#CBD5E1;margin-right:6px;vertical-align:-1px}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(22,163,74,.2)}
.legend2{margin:14px 2px 0;color:var(--muted);font-size:.98rem}
.tv .warn{margin:0 0 16px;padding:10px 14px;border-radius:12px;background:#FFF7E6;border:1px solid #F5D9A0;color:#7A5200;font-size:.95rem}
.spill{font-size:.9rem!important}.who{max-width:200px}
.sync{font-size:.9rem;font-weight:700;color:var(--ok)}.sync.bad{color:var(--bad)}
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}.tbar .upd{color:var(--muted);font-weight:600;font-size:1rem;margin-right:auto}
.btn.danger{border-color:#F3B4B4;color:#B91C1C;background:#FFF5F5}.btn.mini2{padding:5px 12px;font-size:.9rem}
.cfm{position:fixed;inset:0;z-index:80;background:rgba(36,31,61,.45);display:grid;place-items:center;padding:20px}.cfm div{background:#fff;border-radius:22px;padding:26px;max-width:460px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.3)}.cfm p{margin:0 0 18px;font-size:1.12rem;line-height:1.6}.cfm .row{display:flex;gap:10px;justify-content:flex-end}

@media (max-width:560px){.sync{display:none}.lg-card{padding:26px 20px}.who{display:none}}

var EX={
x1:["The nucleus “car” carries the main fall: the new information is the kind of thing she bought, not a bike or a van.","พยางค์หลัก “car” ตกลงชัดเจน เพราะข้อมูลใหม่คือสิ่งที่เธอซื้อ ไม่ใช่จักรยานหรือรถตู้"],
f1:["A statement normally ends with a fall. The voice drops on the nucleus “home”, which tells the listener the sentence is finished.","ประโยคบอกเล่าโดยปกติลงท้ายด้วยเสียงตก เสียงตกลงที่พยางค์หลัก “home” บอกผู้ฟังว่าประโยคจบแล้ว"],

f4:["A simple fact also falls. The nucleus is “raining” and the voice goes down to a low pitch.","ข้อเท็จจริงง่าย ๆ ก็ใช้เสียงตก พยางค์หลักคือ “raining” และเสียงลงไปที่ระดับต่ำ"],
f5:["Wh-questions (where, what, who…) usually fall, so they sound direct and complete.","คำถาม Wh- (where, what, who …) มักใช้เสียงตก ฟังตรงไปตรงมาและสมบูรณ์"],
f6:["Compare with “Is it far?”: the same words, but a fall makes this a statement.","เทียบกับ “Is it far?” คำเดียวกัน แต่เสียงตกทำให้เป็นประโยคบอกเล่า"],
r1:["Yes/no questions usually rise on the nucleus “ready”. The rise leaves the answer open to the listener.","คำถามแบบ Yes/No มักใช้เสียงขึ้นที่พยางค์หลัก “ready” เสียงขึ้นเปิดโอกาสให้ผู้ฟังตอบ"],
r2:["The rise on “far” turns the words into a question. In writing the question mark helps; in speech only the melody does.","เสียงขึ้นที่ “far” ทำให้เป็นคำถาม ในการเขียนมีเครื่องหมายคำถามช่วย แต่ในการพูดมีเพียงทำนองเสียง"],
r3:["A low start and a rise on “here” sounds polite and friendly when you ask permission.","เริ่มจากระดับต่ำแล้วขึ้นที่ “here” ฟังสุภาพเป็นมิตรเมื่อขออนุญาต"],
r4:["The voice stays low, then rises on the last content word “coffee”.","เสียงอยู่ระดับต่ำ แล้วขึ้นที่คำเนื้อหาคำสุดท้าย “coffee”"],
rf1:["Rise-fall: the pitch rises then falls on “brilliant”. It shows strong feeling, such as being impressed.","เสียงขึ้น-ตก: ระดับเสียงขึ้นแล้วตกที่ “brilliant” แสดงความรู้สึกแรง เช่น ประทับใจ"],
rf2:["The rise-fall on “lovely” sounds warm and enthusiastic.","เสียงขึ้น-ตกที่ “lovely” ฟังอบอุ่นและกระตือรือร้น"],
rf3:["A rise-fall on “so” can sound triumphant or self-assured: “I was right!”","เสียงขึ้น-ตกที่ “so” อาจฟังเหมือนผู้พูดมั่นใจหรือได้ชัยชนะ: “ฉันพูดถูกแล้ว!”"],
fr1:["Fall-rise: the pitch falls then rises on “might”. It shows uncertainty or reservation.","เสียงตก-ขึ้น: ระดับเสียงตกแล้วขึ้นที่ “might” แสดงความไม่แน่ใจหรือยังไม่เต็มใจ"],

 i1:{t:'Melody carries meaning',en:'Words give the message; intonation tells the listener how to take it: a question or a statement, sure or unsure, warm or cold. “Is it far?” and “It’s far.” use the same words but mean different things.',th:'คำบอกเนื้อหา ส่วนทำนองเสียง (intonation) บอกผู้ฟังว่าควรตีความอย่างไร เป็นคำถามหรือประโยคบอกเล่า มั่นใจหรือไม่แน่ใจ อบอุ่นหรือเย็นชา เช่น “Is it far?” กับ “It’s far.” ใช้คำเดียวกันแต่ความหมายต่างกัน',sent:'r2'},

 nucleus:{t:'Nucleus (tonic syllable)',en:'The syllable with the main pitch movement (fall, rise, fall-rise or rise-fall). It is the most important syllable of the unit.',th:'พยางค์ที่มีการเคลื่อนไหวของระดับเสียงหลัก (ตก ขึ้น ตก-ขึ้น หรือ ขึ้น-ตก) เป็นพยางค์สำคัญที่สุดของหน่วยเสียง',sent:'f2'},

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function contourSVG(words){
  var Wd=640,H=210,top=24,bot=50,n=words.length,slot=Wd/n,pts=[],rects='',labels='',dots='',i,k;
  for(i=0;i<n;i++){
    var wd=words[i],x0=i*slot+slot*.2,x1=(i+1)*slot-slot*.2,m=wd.p.length;
    for(k=0;k<m;k++){var x=m===1?(x0+x1)/2:x0+(x1-x0)*k/(m-1);pts.push([x,top+(100-wd.p[k])/100*(H-top-bot)]);}
    if(wd.n){rects+='<rect x="'+(i*slot+4)+'" y="6" width="'+(slot-8)+'" height="'+(H-12)+'" rx="16" fill="rgba(219,39,119,.09)" stroke="rgba(219,39,119,.35)"/>';}
    labels+='<text x="'+(i*slot+slot/2)+'" y="'+(H-18)+'" text-anchor="middle" font-family="Sora,Noto Sans,sans-serif" font-size="'+(n>5?20:25)+'" font-weight="'+(wd.n?800:600)+'" fill="'+(wd.n?'#DB2777':'#241F3D')+'">'+esc(wd.w)+'</text>';
  }
  var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(i=1;i<pts.length;i++){var a=pts[i-1],b=pts[i],cx=(a[0]+b[0])/2;d+=' C'+cx.toFixed(1)+' '+a[1].toFixed(1)+' '+cx.toFixed(1)+' '+b[1].toFixed(1)+' '+b[0].toFixed(1)+' '+b[1].toFixed(1);}
  for(i=0;i<pts.length;i++){dots+='<circle class="dot" cx="'+pts[i][0].toFixed(1)+'" cy="'+pts[i][1].toFixed(1)+'" r="4.5" fill="#fff" stroke="#9333EA" stroke-width="2.5"/>';}
  var gid='lg'+(window.__gid=(window.__gid||0)+1);
  return '<svg class="contour" viewBox="0 0 '+Wd+' '+H+'" role="img" aria-label="Pitch contour of the sentence"><defs><linearGradient id="'+gid+'" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+Wd+'" y2="0"><stop offset="0" stop-color="#0284C7"/><stop offset=".55" stop-color="#9333EA"/><stop offset="1" stop-color="#DB2777"/></linearGradient></defs>'
   +rects+'<line x1="0" x2="'+Wd+'" y1="'+(H-bot+6)+'" y2="'+(H-bot+6)+'" stroke="rgba(147,51,234,.25)"/>'
   +'<path class="main" d="'+d+'" fill="none" stroke="url(#'+gid+')" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>'
   +dots+labels+'<circle class="ball" r="9" fill="#DB2777" opacity="0" cx="'+pts[0][0]+'" cy="'+pts[0][1]+'"/></svg>';
}
function animateContours(root){
  if(REDUCED)return;
  var paths=root.querySelectorAll('svg path.main');
  for(var j=0;j<paths.length;j++){(function(p){
    var svg=p.ownerSVGElement,dots=svg.querySelectorAll('.dot'),L=p.getTotalLength();
    p.style.transition='none';p.style.strokeDasharray=L;p.style.strokeDashoffset=L;
    for(var a=0;a<dots.length;a++){dots[a].style.transition='none';dots[a].style.opacity=0;}
    void p.getBoundingClientRect();
    p.style.transition='stroke-dashoffset 1.2s cubic-bezier(.4,.1,.2,1) .25s';p.style.strokeDashoffset=0;
    for(var b=0;b<dots.length;b++){dots[b].style.transition='opacity .45s ease '+(0.3+b*0.1)+'s';dots[b].style.opacity=1;}
  })(paths[j]);}
}
function pickVoice(){
  if(!('speechSynthesis' in window))return null;
  var v=speechSynthesis.getVoices()||[];
  for(var i=0;i<v.length;i++){if(/en[-_]GB/i.test(v[i].lang))return v[i];}
  return null;
}
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.85;var v=pickVoice();if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}
}
function stopSpeech(){if('speechSynthesis' in window){try{speechSynthesis.cancel();}catch(e){}}}
function playBall(host){
  var svg=host.querySelector('svg.contour');if(!svg)return;
  var path=svg.querySelector('path.main'),ball=svg.querySelector('.ball');if(!path||!ball)return;
  var len=path.getTotalLength(),n=svg.querySelectorAll('text').length,dur=Math.max(1400,n*520),t0=null;
  ball.setAttribute('opacity','1');
  function step(ts){if(t0===null)t0=ts;var f=Math.min(1,(ts-t0)/dur),p=path.getPointAtLength(len*f);ball.setAttribute('cx',p.x);ball.setAttribute('cy',p.y);
    if(f<1)requestAnimationFrame(step);else setTimeout(function(){ball.setAttribute('opacity','0');},500);}
  requestAnimationFrame(step);
}
function focusWords(ni){return FOCUS_WORDS.map(function(w,i){return i===ni?W(w,[90,12],1):W(w,i<ni?[58,56]:[14,12],0);});}

/* quiz state */
var QS={};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function qstate(p){
  if(!QS[p]){var Q=QUIZ[p-1];QS[p]={st:Q.map(function(){return {wrong:[],done:false,ft:null};}),ord:Q.map(function(q){return shuffle(q.o.map(function(_,i){return i;}));})};}
  return QS[p];
}
function qScore(p){var n=0;qstate(p).st.forEach(function(x){if(x.ft===true)n++;});return n;}
function qFin(p){return qstate(p).st.every(function(x){return x.done;});}
function qHTML(p,qi,fresh){
  var Q=QUIZ[p-1],q=Q[qi],st=qstate(p),s=st.st[qi];
  var opts=st.ord[qi].map(function(oi){
    var cls='opt',dis=false;
    if(s.done&&oi===q.a){cls+=' right';dis=true;}
    else if(s.wrong.indexOf(oi)>-1){cls+=' wrong'+(oi===fresh?'':' old');dis=true;}
    else if(s.done){dis=true;}
    return '<button class="'+cls+'" data-act="qans" data-p="'+p+'" data-q="'+qi+'" data-o="'+oi+'"'+(dis?' disabled':'')+'>'+esc(q.o[oi])+'</button>';
  }).join('');
  return '<div class="q'+(s.done?' done':'')+'" id="q'+p+'_'+qi+'"><div class="qn">QUESTION '+(qi+1)+' / '+Q.length+'</div><div class="qt">'+esc(q.q)+'</div>'+(q.s?sentRow(q.s):'')
   +'<div class="opts">'+opts+'</div>'+(!s.done&&s.wrong.length?'<div class="try">Not quite — try another option.</div>':'')+'<div class="fb">✔ '+esc(q.why)+'</div></div>';
}
function scoreHTML(p){
  var n=QUIZ[p-1].length,sc=qScore(p);
  return '<div class="score glass"><div class="big">'+sc+'/'+n+'</div><div>'+(sc===n?'Perfect first-try score!':'Part '+p+' complete')+'</div><div class="note">First-try score. Wrong answers lock until you find the right one.</div>'
   +'<div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn" data-act="qreset" data-p="'+p+'">Try again</button><button class="btn pri" data-act="next">'+(p<7?'Next part →':'See results →')+'</button></div></div>';
}
function renderQuiz(p){
  var box=document.getElementById('qz'+p);if(!box)return;
  var Q=QUIZ[p-1];
  box.innerHTML='<div class="qset glass">'+Q.map(function(_,qi){return qHTML(p,qi,-1);}).join('')+'</div><div id="qsc'+p+'">'+(qFin(p)?scoreHTML(p):'')+'</div>';
}

/* ---------- chrome ---------- */
function slideDone(sl){
  if(!sl.visited)return false;
  if(sl.cards.length)return Object.keys(sl.seen).length>=sl.cards.length;
  if(sl.opts.quiz)return qFin(sl.opts.quiz);
  if(sl.opts.lab)return !!sl.used;
  return true;
}
function updateCount(sl){
  var sp=sl.el.querySelector('[data-cnt]');if(!sp)return;
  var n=Object.keys(sl.seen).length,t=sl.cards.length;
  sp.textContent='opened '+n+'/'+t;sp.classList.toggle('full',n>=t&&t>0);
}
function updateChrome(){
  var sl=slides[cur],nav=document.getElementById('partNav');
  nav.innerHTML=PART_CHIPS.map(function(t,i){return '<a data-p="'+i+'" class="'+(i===sl.part?'active':'')+'" tabindex="0" role="link">'+t+'</a>';}).join('');
  var act=nav.querySelector('.active');if(act&&act.scrollIntoView){try{act.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
  var grp=[];slides.forEach(function(s,i){if(s.part===sl.part)grp.push(i);});
  document.getElementById('deckDots').innerHTML=grp.map(function(gi,k){var s=slides[gi];
    return '<button type="button" data-k="'+gi+'" class="'+(gi===cur?'on':'')+(slideDone(s)?' ok':'')+'"><span class="dn">'+(k+1)+'</span><span class="dt">'+esc(s.short)+'</span></button>';}).join('');
  var pos=grp.indexOf(cur);
  document.getElementById('deckCount').textContent=(pos+1)+' / '+grp.length+'  •  '+sl.title;
  document.getElementById('deckBar').style.width=((pos+1)/grp.length*100)+'%';
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('deckPrev').disabled=cur===0;
  document.getElementById('deckNext').disabled=cur===slides.length-1;
  document.getElementById('pCount').textContent=(cur+1)+' / '+slides.length+' · '+sl.title;
}
function go(n,dir){
  if(n<0||n>=slides.length||n===cur)return;
  closeSheet(true);stopSpeech();
  if(dir===undefined)dir=n>=cur?1:-1;
  slides.forEach(function(s){s.el.classList.remove('active','dirL');});
  var sl=slides[n];sl.el.classList.add('active');if(dir<0)sl.el.classList.add('dirL');
  cur=n;sl.visited=true;
  if(sl.opts.onEnter)sl.opts.onEnter();
  updateCount(sl);updateChrome();animateContours(sl.el);
  window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'});
  try{history.replaceState(null,'','#'+(n+1));}catch(e){}
  persist();if(typeof heartbeat==='function')heartbeat();
}
function next(){go(cur+1);}function prev(){go(cur-1);}

/* ---------- expanded sheet ---------- */
var sheet=document.getElementById('sheet'),shCard=document.getElementById('shCard'),shList=[],shIdx=0,shOpen=false,lastFocus=null,closeTimer=null;
function popData(key){
  if(key.indexOf('s:')===0){var id=key.slice(2),s=S[id],ex=EX[id]||['',''];return {t:s.t,sent:id,tag:TONES[s.tone].name+' '+TONES[s.tone].sym,en:ex[0],th:ex[1]};}
  var c=C[key.slice(2)];return {t:c.t,sent:c.sent,tag:c.sym||'',en:c.en,th:c.th,sym:c.sym};
}
function renderSheet(swap){
  var card=shList[shIdx],key=card.getAttribute('data-pop'),P=popData(key),col=card.style.getPropertyValue('--c')||'#9333EA';
  shCard.style.setProperty('--c',col);
  shCard.setAttribute('data-s',P.sent||'');
  var stageHTML,ipaHTML='';
  if(P.sent){var s=S[P.sent];stageHTML='<div class="sh-stage">'+contourSVG(s.w)+'<button class="btn" data-act="play">▶ Play pitch</button></div>';
    ipaHTML='<div class="sh-ipa"><div><span class="lbl">IPA · RP</span><span class="ipa">/'+s.ipa+'/</span></div><button class="spk" data-act="play">🔊 Listen</button></div>';}
  else{stageHTML='<div class="sh-stage"><span class="w">'+esc(P.sym||P.t)+'</span></div>';}
  var one=shList.length<2;
  shCard.innerHTML='<div class="sh-head"><div><span class="tag" style="color:var(--c)">'+esc(P.tag||'')+'</span><h3 id="shTitle">'+esc(P.t)+'</h3></div><span class="sh-pos">'+(shIdx+1)+' / '+shList.length+'</span><button class="sh-x" data-act="shx" aria-label="Close">✕</button></div>'
   +stageHTML+ipaHTML
   +'<div class="sh-ex"><h4>English</h4><p>'+esc(P.en)+'</p></div><div class="sh-ex"><h4>ภาษาไทย</h4><p lang="th">'+esc(P.th)+'</p></div>'
   +'<div class="sh-foot"><button class="btn" data-act="shprev"'+(one?' disabled':'')+'>← Prev</button><span class="sp"></span><button class="btn pri" data-act="shnext"'+(one?' disabled':'')+'>Next →</button></div>';
  shCard.classList.toggle('swap',!!swap);
  var sl=slides[cur];if(sl){sl.seen[key]=1;card.classList.add('seen');updateCount(sl);updateChrome();}
  animateContours(shCard);
  if(swap){stopSpeech();}
}
function openSheet(card){
  if(shOpen)return;
  clearTimeout(closeTimer);
  lastFocus=document.activeElement;
  var sl=slides[cur];shList=sl.cards;shIdx=shList.indexOf(card);if(shIdx<0)return;
  shOpen=true;
  sheet.classList.add('show');document.body.classList.add('sheet-open');
  renderSheet(false);
  shCard.classList.remove('fly');shCard.style.transition='none';
  if(!REDUCED){
    var r=card.getBoundingClientRect(),c=shCard.getBoundingClientRect();
    shCard.style.transform='translate('+(r.left-c.left)+'px,'+(r.top-c.top)+'px) scale('+(r.width/c.width)+','+(r.height/c.height)+')';
    shCard.style.opacity='.15';
  }
  void shCard.offsetWidth;
  shCard.classList.add('fly');shCard.style.transition='';shCard.style.transform='';shCard.style.opacity='';
  sheet.classList.add('in');
  setTimeout(function(){shCard.classList.remove('swap');var x=shCard.querySelector('.sh-x');if(x)x.focus({preventScroll:true});},60);
}
function closeSheet(immediate){
  if(!shOpen)return;
  shOpen=false;stopSpeech();
  sheet.classList.remove('in');
  var card=shList[shIdx];
  if(!immediate&&!REDUCED&&card){
    var r=card.getBoundingClientRect(),c=shCard.getBoundingClientRect();
    shCard.style.transform='translate('+(r.left-c.left)+'px,'+(r.top-c.top)+'px) scale('+(r.width/c.width)+','+(r.height/c.height)+')';
    shCard.style.opacity='0';
  }
  var done=function(){sheet.classList.remove('show');document.body.classList.remove('sheet-open');shCard.classList.remove('fly');shCard.style.transform='';shCard.style.opacity='';shCard.innerHTML='';
    if(lastFocus&&lastFocus.focus){try{lastFocus.focus({preventScroll:true});}catch(e){}}};
  if(immediate||REDUCED){done();}else{closeTimer=setTimeout(done,420);}
}
function shStep(d){
  if(!shOpen||shList.length<2)return;
  shIdx=(shIdx+d+shList.length)%shList.length;
  shCard.classList.remove('swap');void shCard.offsetWidth;renderSheet(true);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var sayEl=t.closest('[data-say]');if(sayEl){speak(sayEl.getAttribute('data-say'));return;}
  var act=t.closest('[data-act]');
  if(act){
    var a=act.getAttribute('data-act');
    switch(a){
      case 'play':var host=act.closest('[data-s]');if(host){var sid=host.getAttribute('data-s');if(S[sid]){speak(S[sid].t);playBall(host);}}return;
      case 'next':next();return;
      case 'shx':closeSheet();return;
      case 'shprev':shStep(-1);return;
      case 'shnext':shStep(1);return;
      case 'focus':setFocus(+act.getAttribute('data-i'));return;
      case 'flplay':var b=document.getElementById('fbox');speak('She bought a red car.');playBall(b);var s2=slides[cur];if(s2){s2.used=true;updateChrome();}return;
      case 'qans':{
        var p=+act.getAttribute('data-p'),qi=+act.getAttribute('data-q'),oi=+act.getAttribute('data-o'),st=qstate(p),s=st.st[qi],q=QUIZ[p-1][qi];
        if(s.done)return;
        if(oi===q.a){s.done=true;if(s.ft!==false)s.ft=true;}else{s.wrong.push(oi);s.ft=false;}
        var old=document.getElementById('q'+p+'_'+qi);
        var tmp=document.createElement('div');tmp.innerHTML=qHTML(p,qi,oi===q.a?-1:oi);old.parentNode.replaceChild(tmp.firstChild,old);
        if(qFin(p)){var sc=document.getElementById('qsc'+p);if(sc&&!sc.innerHTML)sc.innerHTML=scoreHTML(p);}
        updateChrome();trackSave(p);persist();return;}
      case 'qreset':{var p4=+act.getAttribute('data-p');delete QS[p4];renderQuiz(p4);updateChrome();persist();return;}

  return '<div class="stats"><div class="stat glass"><b>'+online+'/'+ROSTER.length+'</b><span>Online now \u00B7 \u0e2d\u0e2d\u0e19\u0e44\u0e25\u0e19\u0e4c\u0e2d\u0e22\u0e39\u0e48</span></div>'
   +'<div class="stat glass"><b>'+started+'/'+ROSTER.length+'</b><span>Started a quiz \u00B7 \u0e40\u0e23\u0e34\u0e48\u0e21\u0e17\u0e33\u0e41\u0e25\u0e49\u0e27</span></div>'
   +'<div class="stat glass"><b>'+(sumN?Math.round(sumS/sumN*100)+'%':'\u2013')+'</b><span>Avg first-try score \u00B7 \u0e04\u0e30\u0e41\u0e19\u0e19\u0e40\u0e09\u0e25\u0e35\u0e48\u0e22</span></div></div>'
   +'<div class="tbl"><table><thead>'+head+'</thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>'
   +'<p class="legend2">\u25CF green dot = active in the last 90 seconds (snapshot at the last refresh) \u00B7 \u2713 green cell = part complete \u00B7 blue cell = in progress \u00B7 cells show first-try score</p>';
}

function confirmBox(msg,okLabel,cb){
  var o=document.createElement('div');o.className='cfm';o.setAttribute('role','alertdialog');o.setAttribute('aria-modal','true');
  o.innerHTML='<div><p>'+esc(msg)+'</p><div class="row"><button type="button" class="btn" id="cfNo">Cancel</button><button type="button" class="btn danger" id="cfYes">'+esc(okLabel)+'</button></div></div>';
  document.body.appendChild(o);
  var close=function(){document.removeEventListener('keydown',kd,true);o.remove();};
  var kd=function(e){if(e.key==='Escape'){e.stopPropagation();close();}};
  document.addEventListener('keydown',kd,true);
  o.querySelector('#cfNo').addEventListener('click',close);
  o.querySelector('#cfYes').addEventListener('click',function(){close();cb();});
  o.querySelector('#cfNo').focus();
}
function doClear(id){
  var m=document.getElementById('tvMsg');m.textContent='';
  api('clear',{pin:PIN,id:id||''}).then(function(r){
    if(r&&r.ok){m.style.color='var(--ok)';m.textContent='\u2713 Cleared '+(id?nameOf(id):'all students')+' ('+(r.removed||0)+' records). Students\u2019 own pages reset on their next sync.';pollTracker();}
    else{m.style.color='var(--bad)';m.textContent='Could not clear ('+((r&&r.error)||'error')+').';}
  });
}
document.getElementById('tvBody').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='rfBtn'){pollTracker();return;}
  if(t.id==='clrAll'){confirmBox('Clear ALL students\u2019 scores from the tracker and the Progress sheet? This cannot be undone.','Clear all',function(){doClear('');});return;}
  var id=t.getAttribute('data-clr');
  if(id)confirmBox('Clear scores of '+nameOf(id)+'? This cannot be undone.','Clear',function(){doClear(id);});
});
document.getElementById('outBtn').addEventListener('click',function(){showLogin();});
document.getElementById('viewBtn').addEventListener('click',function(){
  if(!U||U.type!=='teacher')return;
  if(document.body.classList.contains('st-tracker')){deckPreview=true;clearInterval(tvTimer);document.getElementById('viewBtn').textContent='\u2190 Back to tracker';setView('st-deck');updateChrome();}
  else showTracker();
});
setInterval(function(){heartbeat(true);},CONFIG.HB_MS);

window.__deck={ROSTER:ROSTER,CONFIG:CONFIG,slides:slides,S:S,EX:EX,C:C,QUIZ:QUIZ,go:go,partStart:partStart,get cur(){return cur;}};
var startN=parseInt((location.hash||'').slice(1),10);
go(startN>=1&&startN<=slides.length?startN-1:0,1);
showLogin();
})();
</script>
